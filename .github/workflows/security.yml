name: Security

on:
  push:
  pull_request:
  schedule:
    # Weekly, so newly published queries find existing code.
    # Monday 06:17 UTC — off-the-hour avoids runner contention.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload results to the Security tab
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflow files themselves — worth it, since
        # workflows are the only third-party code this repo pulls in.
        language: [python, actions]

    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

