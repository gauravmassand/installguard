[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkgpatrol"
version = "0.1.0"
description = "Vet npm and PyPI packages for supply-chain red flags before they install — as a Claude Code PreToolUse hook or a standalone CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# No `authors` field: PyPI attributes the project to the uploading account,
# which is enough. Keeping personal names out of published metadata is
# deliberate — once a version is published, its metadata is immutable.
keywords = [
    "supply-chain",
    "security",
    "npm",
    "pypi",
    "claude-code",
    "hook",
    "typosquat",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    # No "License ::" classifier — PEP 639 makes the `license` expression above
    # and legacy license classifiers mutually exclusive, and PyPI rejects
    # uploads carrying both. `twine check` does not catch it; only upload does.
    "Operating System :: OS Independent",
    # Supported versions are declared once, in `requires-python` above —
    # classifiers are display-only and would just drift out of sync.
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

# Zero runtime dependencies — stdlib only (urllib, json, concurrent.futures).
dependencies = []

[project.urls]
# A single source link, deliberately. Auditability matters for a security
# tool, so the repository stays; the rest are redundant with it.
Repository = "https://github.com/gauravmassand/pkgpatrol"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
pkgpatrol = "pkgpatrol.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pkgpatrol"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — unused imports, undefined names
    "W",    # pycodestyle warnings
    "I",    # isort — import ordering
    "UP",   # pyupgrade — outdated syntax for the target version
    "B",    # flake8-bugbear — likely bugs
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # unused arguments
    "C4",   # flake8-comprehensions
]
